<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Layout</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo-container">
                <!-- Aapki di gayi logo image -->
                <img src="images/images.jpg" alt="Instagram Logo" class="insta-logo">
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
                <li><a href="#"><i class="fa-regular fa-compass"></i> Explore</a></li>
                <li><a href="#"><i class="fa-solid fa-clapperboard"></i> Reels</a></li>
                <li><a href="#"><i class="fa-regular fa-message"></i> Messages</a></li>
                <li><a href="#"><i class="fa-regular fa-heart"></i> Notifications</a></li>
                <li><a href="#"><i class="fa-regular fa-square-plus"></i> Create</a></li>
                <li><a href="#"><i class="fa-solid fa-chart-column"></i> Dashboard</a></li>
                <li><a href="#"><i class="fa-regular fa-user"></i> Profile</a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Search">
                </div>
                <div class="nav-actions">
                    <button class="create-post-btn">
                        <i class="fa-solid fa-plus"></i> Create a post
                    </button>
                    <div class="notification-icon">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">1</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic Feed / Content Space -->
            <div class="feed-container">
                <!-- Content goes here -->
            </div>
        </main>
    </div>

</body>
</html>
